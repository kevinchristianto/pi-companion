[package]
name = "companion-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Bounded live-only observer state and authenticated loopback bridge for Pi Companion"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["io-util", "test-util"] }
