[[permission]]
identifier = "allow-companion-ui"
description = "Read the local roster and request a small set of recoverable companion window actions."
commands.allow = ["get_state", "set_pinned", "set_window_mode", "set_click_through", "hide_window", "restore_window", "resize_window", "start_dragging", "set_taskbar_alignment", "set_taskbar_position", "set_taskbar_content_count", "begin_taskbar_drag", "update_taskbar_drag", "end_taskbar_drag"]
