[package]
name = "pi-companion"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
description = "A read-only, local Pi agent companion"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion-shell = { path = "../crates/companion-shell" }
companion-core = { path = "../crates/companion-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
